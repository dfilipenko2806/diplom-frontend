<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Авторизация</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>Авторизация</h1>
    <nav>
        <ul>
            <li class="private"><a href="index.html">Главная</a></li>
            <li class="private"><a href="about.html">О криптовалюте</a></li>
            <li class="private"><a href="features.html">Анализ</a></li>
            <li class="private"><a href="calculator.html">Калькулятор</a></li>
            <li class="private"><a href="dashboard.html">Личный кабинет</a></li>

            <li style="float:right;">
                <button id="logoutBtn" onclick="logout()" style="display:none;">Выйти</button>
            </li>
        </ul>
    </nav>
</header>

<main>

    <h1>Авторизация</h1>

    <div class="card auth-container">

    <div class="tabs">
        <button class="tab active" onclick="switchTab('register')">Регистрация</button>
        <button class="tab" onclick="switchTab('login')">Вход</button>
    </div>

    <!-- Регистрация -->
    <div id="registerBlock">
        <label>Email</label>
        <input id="regEmail" type="email" placeholder="Введите email">

        <label>Пароль</label>
        <input id="regPass" type="password" placeholder="Введите пароль">

        <button onclick="register()">Зарегистрироваться</button>
    </div>

    <!-- Вход -->
    <div id="loginBlock" style="display:none;">
        <label>Email</label>
        <input id="logEmail" type="email" placeholder="Введите email">

        <label>Пароль</label>
        <input id="logPass" type="password" placeholder="Введите пароль">

        <button onclick="login()">Войти</button>
    </div>

</div>

</main>

<footer>
    <p>&copy; Филипенко Д.А. ИТП-31 2025</p>
</footer>

<script src="auth.js"></script>

<script>
if (isAuth()) {
    location.href = "index.html";
}

async function register() {
    const res = await fetch(API + "/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            email: regEmail.value,
            password: regPass.value
        })
    });

    const data = await res.json();

    if (!res.ok) {
        alert(data.error || "Ошибка регистрации");
        return;
    }

    alert("Успешная регистрация! Теперь войдите.");
}

async function login() {
    const res = await fetch(API + "/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            email: logEmail.value,
            password: logPass.value
        })
    });

    const data = await res.json();

    if (!res.ok) {
        alert(data.error || "Ошибка входа");
        return;
    }

    localStorage.setItem("token", data.token);

    location.href = "index.html";
}
</script>

<script>
    protectPage(false); // разрешаем доступ без авторизации
    updateNavbar();
</script>

</body>
</html>
