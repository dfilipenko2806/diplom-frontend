<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
<h1>Криптовалюта</h1>

<nav>
<ul>
    <li class="private"><a href="index.html">Главная</a></li>
    <li class="private"><a href="about.html">О криптовалюте</a></li>
    <li class="private"><a href="features.html">Анализ</a></li>
    <li class="private"><a href="calculator.html">Калькулятор</a></li>
    <li class="private"><a href="dashboard.html">Личный кабинет</a></li>

    <li style="float:right;">
        <button id="logoutBtn" onclick="logout()" style="display:none;">Выйти</button>
    </li>
</ul>
</nav>
</header>

<main>

<h1>Мой портфель</h1>

<div class="card portfolio-form">

    <label>Криптовалюта</label>
    <input id="crypto" placeholder="bitcoin">

    <label>Количество</label>
    <input id="amount" type="number" placeholder="Например: 0.5">

    <label>Цена покупки ($)</label>
    <input id="price" type="number" placeholder="Например: 30000">

    <button class="btn-primary" onclick="add()">Добавить в портфель</button>

</div>

<div class="card">

    <h2 style="margin-bottom: 15px;">Активы</h2>
    <ul id="list" class="portfolio-list"></ul>

</div>

</main>

<footer>
<p>&copy; Филипенко Д.А. ИТП-31 2025</p>
</footer>

<script src="auth.js"></script>

<script>
protectPage();
updateNavbar();

const token = localStorage.getItem("token");

async function add() {
    try {
        // ✅ получаем элементы
        const cryptoInput = document.getElementById("crypto");
        const amountInput = document.getElementById("amount");
        const priceInput = document.getElementById("price");

        // 🔒 проверка токена
        if (!token) {
            alert("Вы не авторизованы");
            location.href = "auth.html";
            return;
        }

        // 📥 значения
        const cryptoValue = cryptoInput.value.trim().toLowerCase();
        const amountValue = Number(amountInput.value);
        const priceValue = Number(priceInput.value);

        // ❌ валидация
        if (!cryptoValue || !amountValue || !priceValue) {
            alert("Заполни все поля");
            return;
        }

        if (amountValue <= 0 || priceValue <= 0) {
            alert("Количество и цена должны быть больше 0");
            return;
        }

        const res = await fetch(API + "/portfolio", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({
                crypto: cryptoValue,
                amount: amountValue,
                buyPrice: priceValue
            })
        });

        const data = await res.json();

        if (!res.ok) {
            alert(data.error || "Ошибка добавления");
            return;
        }

        // ✅ очистка
        cryptoInput.value = "";
        amountInput.value = "";
        priceInput.value = "";

        load();

    } catch (e) {
        console.error("Ошибка:", e);
        alert("Ошибка соединения с сервером");
    }
}

async function load() {
    const res = await fetch(API + "/portfolio", {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    const data = await res.json();

    list.innerHTML = "";

    for (let item of data) {
        const price = await getPrice(item.crypto);
        const profit = ((price - item.buyPrice) * item.amount).toFixed(2);

        const color = profit >= 0 ? "green" : "red";

        list.innerHTML += `
            <li class="portfolio-item">
                <div>
                    <strong>${item.crypto.toUpperCase()}</strong>
                    <p>Кол-во: ${item.amount}</p>
                </div>

                <div>
                    <p>Текущая цена: $${price}</p>
                    <p style="color:${color}; font-weight:bold;">
                        ${profit >= 0 ? "+" : ""}${profit} $
                    </p>
                </div>
            </li>
        `;
    }
}

async function getPrice(crypto) {
    const res = await fetch(
        `https://api.coingecko.com/api/v3/simple/price?ids=${crypto}&vs_currencies=usd`
    );

    const data = await res.json();
    return data[crypto]?.usd || 0;
}

load();
</script>

</body>
</html>
