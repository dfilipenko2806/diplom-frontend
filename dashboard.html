<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Кабинет</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
<h1>Криптовалюта</h1>

<nav>
<ul>
    <li class="private"><a href="index.html">Главная</a></li>
    <li class="private"><a href="about.html">О криптовалюте</a></li>
    <li class="private"><a href="features.html">Анализ</a></li>
    <li class="private"><a href="calculator.html">Калькулятор</a></li>
    <li class="private"><a href="dashboard.html">Личный кабинет</a></li>

    <li style="float:right;">
        <button id="logoutBtn" onclick="logout()" style="display:none;">Выйти</button>
    </li>
</ul>
</nav>
</header>

<main>

<h1>Мой портфель</h1>

<input id="crypto" placeholder="bitcoin">
<input id="amount" placeholder="Количество">
<input id="price" placeholder="Цена">
<button onclick="add()">Добавить</button>

<ul id="list"></ul>

</main>

<script src="auth.js"></script>

<script>
protectPage();
updateNavbar();

const API = "https://diplom-backend-vt6h.onrender.com";
const token = localStorage.getItem("token");

async function add() {
    await fetch(API + "/portfolio", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
            crypto: crypto.value,
            amount: +amount.value,
            buyPrice: +price.value
        })
    });

    load();
}

async function load() {
    const res = await fetch(API + "/portfolio", {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    const data = await res.json();

    list.innerHTML = "";

    for (let item of data) {
        const price = await getPrice(item.crypto);
        const profit = ((price - item.buyPrice) * item.amount).toFixed(2);

        list.innerHTML += `
            <li>
                ${item.crypto} | Кол-во: ${item.amount} | 
                Цена: $${price} | Прибыль: $${profit}
            </li>
        `;
    }
}

async function getPrice(crypto) {
    const res = await fetch(
        `https://api.coingecko.com/api/v3/simple/price?ids=${crypto}&vs_currencies=usd`
    );

    const data = await res.json();
    return data[crypto].usd;
}

load();
</script>

</body>
</html>
